AWSTemplateFormatVersion: "2010-09-09"
Description: Peach weekly reports infrastructure

Parameters:
  ProjectName:
    Type: String
    Default: peach
  ApiExecutionRoleName:
    Type: String
    Description: Existing API Lambda execution role allowed to create request files
  ReportImageUri:
    Type: String
    Description: Immutable URI of the backend image containing both report handlers
  ReportSender:
    Type: String
    Description: SES-verified sender email address
  ReportRecipients:
    Type: CommaDelimitedList
    Description: SES-verified recipients while the account is in sandbox
  SenderDomain:
    Type: String
    Default: ""
    Description: Optional owned domain; verify the output DKIM records in DNS

Conditions:
  HasSenderDomain: !Not [!Equals [!Ref SenderDomain, ""]]

Resources:
  SenderDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasSenderDomain
    Properties:
      EmailIdentity: !Ref SenderDomain

  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: [ReportMailerPermission, ReportDispatcherPermission]
    Properties:
      BucketName: !Sub "peach-reports-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ReportMailer.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ReportDispatcher.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: requests/
                  - Name: suffix
                    Value: .json
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
          - Id: DeleteRequests
            Status: Enabled
            Prefix: requests/
            ExpirationInDays: 7

  ApiReportRequestPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PeachReportRequests
      Roles: [!Ref ApiExecutionRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::peach-reports-${AWS::AccountId}-${AWS::Region}/requests/*"

  ReportDispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RequestDispatch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::peach-reports-${AWS::AccountId}-${AWS::Region}/requests/*"
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportsQueue.Arn

  ReportDispatcher:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: peach-report-dispatcher
      PackageType: Image
      Code: {ImageUri: !Ref ReportImageUri}
      ImageConfig:
        Command: [app.reports.dispatcher.handler]
      Architectures: [arm64]
      Role: !GetAtt ReportDispatcherRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          REPORTS_BUCKET: !Sub "peach-reports-${AWS::AccountId}-${AWS::Region}"
          REPORT_QUEUE_URL: !Ref ReportsQueue

  ReportDispatcherPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReportDispatcher
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::peach-reports-${AWS::AccountId}-${AWS::Region}"

  ReportsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: peach-reports-dlq

  ReportsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: peach-reports-queue
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportsDLQ.Arn
        maxReceiveCount: 3

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: vpc-021d221c07e003f97
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - rtb-05f63be5ef0440b79


  ReportBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReportsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::peach-reports-${AWS::AccountId}-${AWS::Region}/reports/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportsQueue.Arn

  ReportBuilder:
    Type: AWS::Lambda::Function
    DependsOn: S3GatewayEndpoint
    Properties:
      FunctionName: peach-report-builder
      PackageType: Image
      Code:
        ImageUri: !Ref ReportImageUri
      ImageConfig:
        Command:
          - app.reports.lambda_handler.handler
      Architectures:
        - arm64
      Role: !GetAtt ReportBuilderRole.Arn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SecurityGroupIds:
          - sg-0594b79a6a59c8e79
        SubnetIds:
          - subnet-0a79e656ccbd43018
          - subnet-09d34893c725a9f3d
          - subnet-0926d5aeef6819cbe
          - subnet-0b7a453d7e0f30ebe
          - subnet-0e408246861281045
      Environment:
        Variables:
          APP_ENV: production
          DB_POOLING: "false"
          DATABASE_URL: !Sub "{{resolve:secretsmanager:peach/backend/database-url:SecretString}}"
          REPORTS_BUCKET: !Ref ReportsBucket

  ReportsEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportsQueue.Arn
      FunctionName: !Ref ReportBuilder
      BatchSize: 1
      Enabled: true

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendReportsMessage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportsQueue.Arn

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: peach-weekly-reports
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt ReportsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week":null,"source":"schedule"}'


  ReportMailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::peach-reports-${AWS::AccountId}-${AWS::Region}/reports/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  ReportMailer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: peach-report-mailer
      PackageType: Image
      Code:
        ImageUri: !Ref ReportImageUri
      ImageConfig:
        Command:
          - app.reports.mailer.handler
      Architectures:
        - arm64
      Role: !GetAtt ReportMailerRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          REPORT_SENDER: !Ref ReportSender
          REPORT_RECIPIENTS: !Join [",", !Ref ReportRecipients]

  ReportMailerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReportMailer
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::peach-reports-${AWS::AccountId}-${AWS::Region}"

Outputs:
  ReportsBuilderName:
    Value: !Ref ReportBuilder
  ReportsBucketName:
    Value: !Ref ReportsBucket
  ReportsQueueUrl:
    Value: !Ref ReportsQueue
  ReportsDLQUrl:
    Value: !Ref ReportsDLQ
  SenderDkimName1:
    Condition: HasSenderDomain
    Value: !GetAtt SenderDomainIdentity.DkimDNSTokenName1
  SenderDkimValue1:
    Condition: HasSenderDomain
    Value: !GetAtt SenderDomainIdentity.DkimDNSTokenValue1
  SenderDkimName2:
    Condition: HasSenderDomain
    Value: !GetAtt SenderDomainIdentity.DkimDNSTokenName2
  SenderDkimValue2:
    Condition: HasSenderDomain
    Value: !GetAtt SenderDomainIdentity.DkimDNSTokenValue2
  SenderDkimName3:
    Condition: HasSenderDomain
    Value: !GetAtt SenderDomainIdentity.DkimDNSTokenName3
  SenderDkimValue3:
    Condition: HasSenderDomain
    Value: !GetAtt SenderDomainIdentity.DkimDNSTokenValue3
