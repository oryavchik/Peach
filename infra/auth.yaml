AWSTemplateFormatVersion: "2010-09-09"
Description: Peach Cognito authentication

Parameters:
  ProjectName:
    Type: String
    Default: peach

  GoogleClientId:
    Type: String
    Description: Google OAuth client ID

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth client secret

  FrontendUrl:
    Type: String
    Default: https://d2u4q6uy2ofop2.cloudfront.net

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

      UsernameConfiguration:
        CaseSensitive: false

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false

      UserPoolTier: ESSENTIALS

      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google

      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"

      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${ProjectName}-web"

      GenerateSecret: false

      SupportedIdentityProviders:
        - COGNITO
        - Google

      AllowedOAuthFlowsUserPoolClient: true

      AllowedOAuthFlows:
        - code

      AllowedOAuthScopes:
        - openid
        - email
        - profile

      CallbackURLs:
        - !Sub "${FrontendUrl}/auth/callback/"
        - http://localhost:3000/auth/callback

      DefaultRedirectURI: !Sub "${FrontendUrl}/auth/callback/"

      LogoutURLs:
        - !Sub "${FrontendUrl}/"
        - http://localhost:3000

      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: peach-506126098984
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn:
      - UserPoolDomain
      - UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool

  UserPoolClientId:
    Value: !Ref UserPoolClient

  CognitoDomain:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  CognitoAuthority:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
